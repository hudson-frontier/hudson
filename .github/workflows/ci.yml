name: Harness checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository policy and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check licensing and version consistency
        run: python3 scripts/check_repository.py
      - name: Test community automation
        run: node --test .github/scripts/*.test.cjs
      - name: Validate GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  harbor:
    name: Harbor integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Harbor integration and its declared dependencies
        run: python -m pip install ./integrations/harbor
      - name: Build the real worker for the integration tests
        env:
          # Runner images can contain incomplete components for the pinned toolchain.
          RUSTUP_HOME: ${{ runner.temp }}/hudson-rustup
        run: cargo build --locked -p hudson-worker
      - name: Test Harbor adapter and verifiers with local fixtures
        env:
          HUDSON_WORKER: ${{ github.workspace }}/target/debug/hudson-worker
        run: python -m unittest discover -s integrations/harbor/tests -v

  native_sdk:
    name: Native SDK conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned native SDK
        run: python -m pip install -r integrations/agent_sdk/requirements.txt
      - name: Install namespace isolation dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles
      - name: Check kernel namespace availability
        run: bash .github/scripts/check-namespace.sh
      - name: Build the real worker
        env:
          RUSTUP_HOME: ${{ runner.temp }}/hudson-native-rustup
        run: cargo build --locked -p hudson-worker
      - name: Check private native checkpoints
        run: python -I -m unittest discover -s integrations/agent_sdk -v
      - name: Exercise real SDK and worker against local fixtures
        run: python -I scripts/smoke_native_sdk.py --python "$(command -v python)" --worker "$GITHUB_WORKSPACE/target/debug/hudson-worker" --bubblewrap /usr/bin/bwrap --reasoning-effort high

  native_codex:
    name: Native CLI conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned native executable
        run: npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/hudson-codex" @openai/codex@0.165.0
      - name: Install namespace isolation dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles
      - name: Check kernel namespace availability
        run: bash .github/scripts/check-namespace.sh
      - name: Build the real worker
        env:
          RUSTUP_HOME: ${{ runner.temp }}/hudson-cli-rustup
        run: cargo build --locked -p hudson-worker
      - name: Check RPC, provider admission and native files
        run: |
          python -I -m unittest discover -s integrations/codex -v
          python -I -m unittest discover -s integrations/agent_sdk -v
      - name: Exercise real CLI and worker inside isolation
        run: |
          native="$(python -c 'import os,pathlib; root=pathlib.Path(os.environ["RUNNER_TEMP"])/"hudson-codex/node_modules"; found=list(root.glob("**/vendor/x86_64-unknown-linux-musl/bin/codex")); assert len(found)==1; print(found[0])')"
          python -I scripts/smoke_native_codex.py --codex "$native" --python "$(command -v python)" --worker "$GITHUB_WORKSPACE/target/debug/hudson-worker" --bubblewrap /usr/bin/bwrap --reasoning-effort high

  integration:
    name: Rust, PostgreSQL, and Temporal
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_BACKTRACE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Start isolated local PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql protobuf-compiler bubblewrap apparmor-profiles
          sudo systemctl stop postgresql
          pg_bin="$(pg_config --bindir)"
          "$pg_bin/initdb" -D "$RUNNER_TEMP/hudson-pg" --auth=trust
          "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/hudson-pg" -l "$RUNNER_TEMP/hudson-postgres.log" -o "-k /tmp -h ''" -w start
          "$pg_bin/createdb" -h /tmp hudson_harness_test_20260921
      - name: Check kernel namespace availability
        run: bash .github/scripts/check-namespace.sh
      - name: Run all local checks with durable execution
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check.py --database hudson_harness_test_20260921 --temporal 2>&1 | tee "$RUNNER_TEMP/hudson-check.log"
      - name: Preserve check logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-check-logs
          path: |
            ${{ runner.temp }}/hudson-check.log
            ${{ runner.temp }}/hudson-postgres.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated PostgreSQL
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/hudson-pg/postmaster.pid" ]; then
            "$(pg_config --bindir)/pg_ctl" -D "$RUNNER_TEMP/hudson-pg" -m fast -w stop
          fi

  ci:
    name: CI
    if: always()
    needs: [repository, harbor, native_sdk, native_codex, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required jobs did not pass: ' + ', '.join(failed))
          print('All CI checks passed.')
          PY
