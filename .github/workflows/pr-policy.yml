name: Pull request policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Release PR number to validate on the selected branch
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
        with:
          script: |
            const pr = context.payload.pull_request || (await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER)
            })).data;
            if (context.eventName === 'workflow_dispatch' &&
                (pr.head.sha !== context.sha || pr.head.repo.full_name !== context.payload.repository.full_name)) {
              throw new Error('Dispatch must target the current PR head in this repository.');
            }
            const pattern = /^(feat|fix|perf|docs|test|refactor|build|ci|chore|revert)(\([^()\r\n]+\))?!?: \S[^\r\n]*$/;
            if (!pattern.test(pr.title)) {
              core.setFailed('Use a Conventional Commit title, for example fix(core): preserve cancellation.');
            }
